version: '3.9'

# =============================================================================
# Local development stack
# Services:
#   - storage-service  — this application
#   - minio            — S3-compatible local storage backend
#   - minio-setup      — one-shot bucket creation
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  storage-service:
    build:
      context: .
      target: runtime
    container_name: storage-service
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: debug
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: storage-service
      MINIO_USE_SSL: "false"
      DEFAULT_BUCKET: storage-service
      PRESIGNED_URL_TTL_SECONDS: "3600"
      MAX_FILE_SIZE_MB: "100"
      AUTH_ENABLED: "false"
    volumes:
      - ./logs:/app/logs
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # MinIO (local S3-compatible storage)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (http://localhost:9001 | minioadmin/minioadmin)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # One-shot MinIO bucket setup
  # ---------------------------------------------------------------------------
  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/storage-service &&
        echo 'Bucket ready'
      "
    networks:
      - storage-net

volumes:
  minio-data:

networks:
  storage-net:
    driver: bridge
