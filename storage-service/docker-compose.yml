version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# SericeStore — local development stack
#
# Services:
#   storage-service   : the Node.js API (hot-reload via ts-node-dev)
#   minio             : S3-compatible object storage
#   minio-mc          : one-shot container that provisions the default bucket
#   prometheus        : metrics scraping
#   grafana           : dashboard UI
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Application ────────────────────────────────────────────────────────────
  storage-service:
    build:
      context: .
      target: runtime
    image: storage-service:local
    container_name: storage-service
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: storage-service
      AUTH_ENABLED: "false"          # disable JWT in local dev
      LOG_LEVEL: debug
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      IMAGE_MAGICK_PATH: /usr/bin/convert
    ports:
      - "3000:3000"
    depends_on:
      minio-mc:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - storage-net

  # ── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storage-net

  # ── MinIO bucket provisioner (runs once, then exits) ───────────────────────
  minio-mc:
    image: minio/mc:RELEASE.2024-06-10T16-36-03Z
    container_name: minio-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/storage-service &&
        echo 'Bucket ready'
      "
    networks:
      - storage-net

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9090:9090"
    networks:
      - storage-net

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - storage-net

volumes:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  storage-net:
    driver: bridge
