version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Storage Service – local development stack
#
# Services:
#   app       – the Storage Service API
#   minio     – S3-compatible object store (local backend)
#   mc        – MinIO client (creates the default bucket on first run)
# ─────────────────────────────────────────────────────────────────────────────

x-app-env: &app-env
  STORAGE_BACKEND: minio
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: storage-service
  MINIO_SECURE: "false"
  LOG_LEVEL: DEBUG
  LOG_FORMAT: text
  DEBUG: "true"
  RELOAD: "true"
  IMAGEMAGICK_BINARY: convert
  FFMPEG_BINARY: ffmpeg
  FFPROBE_BINARY: ffprobe

services:
  # ── Application ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      target: runtime
    image: storage-service:dev
    container_name: storage-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *app-env
    volumes:
      # Hot-reload: mount source directly (requires RELOAD=true)
      - ./src:/app/src:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    command: >
      python -m uvicorn src.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --log-config /dev/null

  # ── MinIO ────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: storage-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console  (http://localhost:9001)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MinIO setup (one-shot) ────────────────────────────────────────────────────
  mc:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    container_name: storage-mc-setup
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - storage-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/storage-service;
        mc anonymous set download local/storage-service;
        echo 'MinIO bucket ready.';
      "
    restart: "no"

volumes:
  minio-data:
    driver: local

networks:
  storage-net:
    driver: bridge
