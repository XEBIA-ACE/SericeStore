[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    -q

markers =
    unit: pure unit tests (no external services)
    integration: integration tests (may require docker services)
    slow: tests that take more than a few seconds
