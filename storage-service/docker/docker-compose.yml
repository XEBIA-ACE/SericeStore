version: "3.9"

# =============================================================================
# SericeStore — local development stack
#
# Services:
#   sericestore  — the FastAPI application
#   minio        — S3-compatible local storage
#   minio-init   — one-shot bucket creation
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # SericeStore API
  # ---------------------------------------------------------------------------
  sericestore:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: sericestore:dev
    container_name: sericestore
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      # Application
      APP_NAME: SericeStore
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG

      # Storage backend — use MinIO for local development
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: sericestore
      MINIO_SECURE: "false"

      # Auth (disabled for local dev)
      AUTH_ENABLED: "false"

      # Limits
      MAX_UPLOAD_SIZE_MB: "500"
      TEMP_DIR: /tmp/sericestore
    volumes:
      # Hot-reload: mount source code in dev mode
      - ../src:/app/src:ro
      - ../main.py:/app/main.py:ro
      - sericestore_tmp:/tmp/sericestore
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible local object storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: sericestore-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # MinIO init — creates the default bucket once MinIO is healthy
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: sericestore-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/sericestore &&
        echo 'Bucket created: sericestore'
      "
    restart: "no"

volumes:
  minio_data:
    name: sericestore_minio_data
  sericestore_tmp:
    name: sericestore_tmp
